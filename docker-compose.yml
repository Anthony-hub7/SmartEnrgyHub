name: smartenergy-hub

# ----------------------------------------------------------------------------
# Demarrage :  cp .env.example .env && docker compose up -d --build
# Simulateur :  docker compose run --rm simulator
# Les ports des BASES ne sont PAS publies ici (securite) : voir docker-compose.override.yml (dev).
# ----------------------------------------------------------------------------

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: ${SPRING_MEM_LIMIT:-512m}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 45s

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: docker
  SERVER_PORT: "8080"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  # Heap borne a 60% de la limite memoire du conteneur (SPRING_MEM_LIMIT, .env) + GC leger.
  JAVA_OPTS: ${SPRING_JAVA_OPTS:--XX:MaxRAMPercentage=75}

services:
  # ------------------------------------------------------------ infrastructure
  # Limites memoire : cables ici depuis .env (mem_limit/docker compose) pour eviter qu'une
  # base prenne toute la RAM de la machine de dev (voir bloc "Limites de ressources").
  redis:
    image: redis:7
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-96m}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--requirepass", "${REDIS_PASSWORD:?copiez .env.example vers .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?copiez .env.example vers .env}
      MONGO_SENSOR_PASSWORD: ${MONGO_SENSOR_PASSWORD:?}
      MONGO_ANALYTICS_PASSWORD: ${MONGO_ANALYTICS_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
      # Execute UNE SEULE FOIS (volume vide) : utilisateurs + index. Re-jouer : docker compose down -v
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cassandra:
    image: cassandra:4
    environment:
      CASSANDRA_CLUSTER_NAME: smartenergy
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-512M}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-128M}
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      # Cassandra met souvent 1 a 2 minutes a etre pret : start_period genereux
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 60s

  cassandra-init:
    image: cassandra:4
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./scripts/init-cassandra.cql:/init.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/init.cql"]
    restart: "no"

  # ------------------------------------------------------------ services applicatifs
  collector-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: ./collector-service }
      cache_from:
        - maven:3.9-eclipse-temurin-17
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Regle CDC 5.2 : 24 h par defaut. Pour un backfill (simulateur en horloge virtuelle),
      # surcharger temporairement : MEASUREMENT_MAX_AGE=P31D dans .env (voir simulator/README).
      # Syntaxe ISO-8601 : P31D = 31 jours, PT24H = 24 h (PT31D est INVALIDE).
      MEASUREMENT_MAX_AGE: ${MEASUREMENT_MAX_AGE:-PT24H}
    ports: ["8081:8080"]
    depends_on:
      redis: { condition: service_healthy }

  storage-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: ./storage-service }
      cache_from:
        - maven:3.9-eclipse-temurin-17
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CASSANDRA_HOST: cassandra
    ports: ["8082:8080"]
    depends_on:
      redis: { condition: service_healthy }
      cassandra-init: { condition: service_completed_successfully }

  analytics-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: ./analytics-service }
      cache_from:
        - maven:3.9-eclipse-temurin-17
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGO_HOST: mongo
      MONGO_ANALYTICS_PASSWORD: ${MONGO_ANALYTICS_PASSWORD}
      SENSOR_SERVICE_URL: http://sensor-service:8080
      # Prevision IA (extension 9C) : false = 501 FORECAST_DISABLED (defaut).
      ANALYTICS_FORECAST_ENABLED: ${ANALYTICS_FORECAST_ENABLED:-false}
    volumes:
      - ./models:/app/models:ro
    ports: ["8083:8080"]
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      sensor-service: { condition: service_started }

  sensor-service:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: ./sensor-service }
      cache_from:
        - maven:3.9-eclipse-temurin-17
    environment:
      <<: *java-env
      MONGO_HOST: mongo
      MONGO_SENSOR_PASSWORD: ${MONGO_SENSOR_PASSWORD}
    ports: ["8084:8080"]
    depends_on:
      mongo: { condition: service_healthy }

  # ------------------------------------------------------------ outil (profil "tools")
  simulator:
    profiles: ["tools"]
    build:
      context: .
      args: { SERVICE: ./simulator }
      cache_from:
        - maven:3.9-eclipse-temurin-17
    restart: "no"
    environment:
      SMARTENERGY_SIMULATOR_TARGET_URL: http://collector-service:8080
      SMARTENERGY_SIMULATOR_SENSOR_SERVICE_URL: http://sensor-service:8080
      SMARTENERGY_SIMULATOR_SENSORS: ${SIMULATOR_SENSORS:-5}
      SMARTENERGY_SIMULATOR_INTERVAL: ${SIMULATOR_INTERVAL:-PT2S}
      SMARTENERGY_SIMULATOR_DURATION: ${SIMULATOR_DURATION:-PT2M}
      SMARTENERGY_SIMULATOR_REGISTER_SENSORS: "true"
      # Backfill (jeu de donnees IA, extension 9C) : SIMULATOR_BACKFILL_DAYS=30 + interval PT5M
      # + MEASUREMENT_MAX_AGE=P31D dans .env pour que le collector accepte les timestamps anciens.
      SMARTENERGY_SIMULATOR_BACKFILL_DAYS: ${SIMULATOR_BACKFILL_DAYS:-0}
      SMARTENERGY_SIMULATOR_BACKFILL_PACE: ${SIMULATOR_BACKFILL_PACE:-200}
    depends_on:
      collector-service: { condition: service_healthy }
      sensor-service: { condition: service_healthy }

  # ------------------------------------------------------------ dashboard web (HTML/JavaScript, port 8085)
  dashboard:
    <<: *java-service
    build:
      context: .
      args: { SERVICE: ./platform/dashboard }
      cache_from:
        - maven:3.9-eclipse-temurin-17
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      # URLs des services applicatifs (noms DNS Docker Compose, port conteneur 8080)
      SMARTENERGY_DASHBOARD_COLLECTOR_URL: http://collector-service:8080
      SMARTENERGY_DASHBOARD_STORAGE_URL: http://storage-service:8080
      SMARTENERGY_DASHBOARD_ANALYTICS_URL: http://analytics-service:8080
      SMARTENERGY_DASHBOARD_SENSOR_URL: http://sensor-service:8080
    ports: ["8085:8080"]
    depends_on:
      collector-service: { condition: service_started }
      storage-service: { condition: service_started }
      analytics-service: { condition: service_started }
      sensor-service: { condition: service_started }

volumes:
  redis_data:
  mongo_data:
  cassandra_data:
