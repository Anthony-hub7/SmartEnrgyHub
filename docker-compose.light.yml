name: smartenergy-hub-light

# ----------------------------------------------------------------------------
# SmartEnergy Hub - environnement LEGER pour presentation vendredi.
# Infra Docker minimale : Cassandra + Redis + cassandra-init (schema).
# Les 4 services Spring Boot se lancent EN LOCAL (JDK 17 + Maven) contre cette infra.
#
# Demarrage :  docker compose -f docker-compose.light.yml --env-file .env.light up -d
# Arret      :  docker compose -f docker-compose.light.yml down
# Reset      :  docker compose -f docker-compose.light.yml down -v
# ----------------------------------------------------------------------------

services:
  # ------------------------------------------------------------ Redis (leger)
  redis:
    image: redis:7
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-64m}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?definissez REDIS_PASSWORD dans .env.light}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ Cassandra (leger)
  cassandra:
    image: cassandra:4
    mem_limit: ${CASSANDRA_MEM_LIMIT:-768m}
    mem_reservation: ${CASSANDRA_MEM_RESERVATION:-384m}
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-384M}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-96M}
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      # Cassandra met 1 a 2 min a etre pret au premier demarrage
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 60s

  # ------------------------------------------------------------ Init schema Cassandra
  cassandra-init:
    image: cassandra:4
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./scripts/init-cassandra.cql:/init.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/init.cql"]
    restart: "no"

volumes:
  cassandra_data:
  redis_data:
